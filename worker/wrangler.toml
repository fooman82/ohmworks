name = "ohmworks-contact"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Keep variables/secrets set in the dashboard (e.g. MAILGUN_API_KEY) when deploying
keep_vars = true

[vars]
# Sender must be on the domain verified in Mailgun (MAILGUN_DOMAIN below)
FROM_ADDRESS = "OHMWORKS Website <website@ohmworks.com.au>"
TO_ADDRESS = "glen@ohmworks.com.au"
# Sending domain exactly as shown in Mailgun (US region, state: active)
MAILGUN_DOMAIN = "ohmworks.com.au"
# Use "https://api.eu.mailgun.net" for EU-region Mailgun accounts
MAILGUN_API_BASE = "https://api.mailgun.net"

# Secrets (set with: wrangler secret put <NAME>)
#   CONTACT_SECRET     shared with the Pages function
#   MAILGUN_API_KEY    Mailgun private API key (or a domain sending key)
